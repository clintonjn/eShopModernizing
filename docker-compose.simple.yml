version: '3.4'

services:
  eshop.modernized.mvc:
    build:
      context: ./eShopModernizedMVCSolution/src/eShopModernizedMVC
      dockerfile: Dockerfile
    ports:
      - "5115:80"
    environment:
      - CatalogDBContext=Server=sql.data;Database=Microsoft.eShopOnContainers.Services.CatalogDb;User Id=sa;Password=Pass@word
      - UseMockData=True
      - UseCustomizationData=False
      - UseAzureStorage=False
    depends_on:
      - sql.data

  eshop.modernized.webforms:
    build:
      context: ./eShopModernizedWebFormsSolution/src/eShopModernizedWebForms
      dockerfile: Dockerfile
    ports:
      - "5114:80"
    environment:
      - CatalogDBContext=Server=sql.data;Database=Microsoft.eShopOnContainers.Services.CatalogDb;User Id=sa;Password=Pass@word
      - UseMockData=True
      - UseCustomizationData=False
      - UseAzureStorage=False
    depends_on:
      - sql.data

  eshopwcfservice:
    build:
      context: ./eShopModernizedNTier/src/eShopWCFService
      dockerfile: Dockerfile
    ports:
      - "5113:80"
    environment:
      - CatalogDBContext=Server=sql.data;Database=eShopDatabase;User Id=sa;Password=Pass@word
    depends_on:
      - sql.data

  sql.data:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - SA_PASSWORD=Pass@word
      - ACCEPT_EULA=Y
    ports:
      - "5433:1433"
    healthcheck:
      test: ["CMD-SHELL", "sqlcmd -S localhost -U sa -P Pass@word -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5