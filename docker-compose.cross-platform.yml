version: '3.4'

services:
  eshop-mvc-core:
    build:
      context: ./eShopLegacyMVCSolution
      dockerfile: eShopPorted/Dockerfile
    ports:
      - "5119:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - UseMockData=true
      - UseCustomizationData=true
    depends_on:
      - sql.data

  sql.data:
    image: mcr.microsoft.com/mssql/server:2019-latest
    environment:
      - SA_PASSWORD=Pass@word
      - ACCEPT_EULA=Y
    ports:
      - "5433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P Pass@word -Q 'SELECT 1'"]
      interval: 30s
      timeout: 10s
      retries: 5